[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyagent-evals"
version = "0.1.0"
description = "Evaluation framework for agent quality"
requires-python = ">=3.11"
dependencies = [
    "pytest>=7.0",
    "rich>=13.0",
    "pyagent-agent",
    "pyagent-ai",
    "pyagent-protocol",
]

[tool.setuptools.packages.find]
where = ["src"]
