[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyagent-protocol"
version = "0.1.0"
description = "Pydantic message models and CBOR serialization"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "cbor2>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
