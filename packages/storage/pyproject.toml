[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyagent-storage"
version = "0.1.0"
description = "SQLModel + SQLite persistence"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.16",
    "pyagent-protocol",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
