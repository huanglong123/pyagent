[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyagent-tui"
version = "0.1.0"
description = "Terminal UI with Textual"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.40",
    "rich>=13.0",
    "pyagent-agent",
    "pyagent-ai",
    "pyagent-protocol",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
