[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyagent-coding-agent"
version = "0.1.0"
description = "CLI application: interactive / pipe / RPC modes"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyagent-agent",
    "pyagent-ai",
    "pyagent-protocol",
    "pyagent-storage",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
